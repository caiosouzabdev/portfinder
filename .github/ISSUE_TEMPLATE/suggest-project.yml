name: Suggest a project
description: Propose a decomp or recomp port to add to the catalog
title: "Suggest: "
labels: ["catalog"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a project for the portfinder catalog. Maintainers may ask you to open a PR with the JSON entry.
        **Do not** link to ROMs, ISOs, or copyrighted game assets.
  - type: input
    id: name
    attributes:
      label: Project name
      placeholder: Zelda 64: Recompiled
    validations:
      required: true
  - type: input
    id: id
    attributes:
      label: Suggested id (kebab-case)
      placeholder: zelda64-recomp
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Short summary
      description: One or two sentences about what the project does.
    validations:
      required: true
  - type: input
    id: original-platform
    attributes:
      label: Original platform
      placeholder: N64
    validations:
      required: true
  - type: input
    id: target-platforms
    attributes:
      label: Target platforms
      description: Comma-separated
      placeholder: PC
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - ACTIVE
        - WIP
        - ARCHIVED
        - UNKNOWN
    validations:
      required: true
  - type: input
    id: repo-url
    attributes:
      label: Repository URL
      placeholder: https://github.com/org/repo
    validations:
      required: true
  - type: input
    id: homepage-url
    attributes:
      label: Homepage URL (optional)
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated
      placeholder: recomp, n64
  - type: checkboxes
    id: policy
    attributes:
      label: Policy
      options:
        - label: I am not linking ROMs, ISOs, or copyrighted game assets.
          required: true
