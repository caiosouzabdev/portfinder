databases:
  - name: portfinder-db
    plan: free
    databaseName: portfinder
    user: portfinder

services:
  - type: web
    name: portfinder
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfinder-db
          property: connectionString
      - key: PORTFINDER_OAUTH_ENABLED
        value: "false"
