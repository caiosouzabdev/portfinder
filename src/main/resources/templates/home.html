<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
  <title>portfinder — decomp &amp; recomp ports</title>
</head>
<body>
<main class="shell">
  <section class="hero">
    <h1 class="brand-hero">portfinder</h1>
    <p class="lede">A curated index of game decompilation and recompilation ports — search by platform, status, and tags.</p>
  </section>

  <form class="filters" method="get" th:action="@{/}" th:object="${criteria}">
    <label class="field grow">
      <span>search</span>
      <input type="search" name="q" th:value="*{query}" placeholder="name, tag, platform…" autocomplete="off">
    </label>
    <label class="field">
      <span>original</span>
      <select name="original">
        <option value="">any</option>
        <option th:each="p : ${originalPlatforms}" th:value="${p}" th:text="${p}"
                th:selected="${criteria.originalPlatform != null and criteria.originalPlatform.equalsIgnoreCase(p)}"></option>
      </select>
    </label>
    <label class="field">
      <span>target</span>
      <select name="target">
        <option value="">any</option>
        <option th:each="p : ${targetPlatforms}" th:value="${p}" th:text="${p}"
                th:selected="${criteria.targetPlatform != null and criteria.targetPlatform.equalsIgnoreCase(p)}"></option>
      </select>
    </label>
    <label class="field">
      <span>status</span>
      <select name="status">
        <option value="">any</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                th:selected="${criteria.status == s}"></option>
      </select>
    </label>
    <label class="field">
      <span>tag</span>
      <select name="tag">
        <option value="">any</option>
        <option th:each="t : ${tags}" th:value="${t}" th:text="${t}"
                th:selected="${criteria.tag == t}"></option>
      </select>
    </label>
    <label class="field">
      <span>sort</span>
      <select name="sort">
        <option value="UPDATED_DESC" th:selected="${criteria.sort.name() == 'UPDATED_DESC'}">updated</option>
        <option value="NAME_ASC" th:selected="${criteria.sort.name() == 'NAME_ASC'}">name</option>
      </select>
    </label>
    <button type="submit" class="btn">run</button>
  </form>

  <p class="meta"><span th:text="${resultCount}">0</span> project<span th:if="${resultCount != 1}">s</span></p>

  <ul class="project-list" th:if="${!projects.isEmpty()}">
    <li th:each="project : ${projects}" class="project-row">
      <a class="project-link" th:href="@{/projects/{id}(id=${project.id.value()})}">
        <div class="project-head">
          <strong th:text="${project.name}">Name</strong>
          <span class="status" th:classappend="| status-${project.status.name().toLowerCase()}|" th:text="${project.status}">ACTIVE</span>
        </div>
        <p class="summary" th:text="${project.summary}">Summary</p>
        <div class="chips">
          <span class="chip" th:text="${project.originalPlatform.label()}">N64</span>
          <span class="chip muted" th:each="tp : ${project.targetPlatforms}" th:text="|→ ${tp.label()}|">→ PC</span>
          <span class="chip tag" th:each="tag : ${project.tags}" th:text="${tag}">tag</span>
        </div>
      </a>
    </li>
  </ul>
  <p class="empty" th:if="${projects.isEmpty()}">No projects matched. Broaden filters or <a th:href="@{/contribute}">suggest one</a>.</p>
</main>
</body>
</html>
