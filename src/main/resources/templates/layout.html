<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, head)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
  <meta name="description" content="Community index of game decompilation and recompilation ports — browse, vote, and submit projects.">
  <meta property="og:site_name" content="portfinder">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <title th:replace="${title}">portfinder</title>
  <th:block th:replace="${head} ?: ~{}"></th:block>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/terminal.css}">
</head>
<body>
  <canvas id="matrix-rain" class="matrix-rain" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <header class="site-header">
    <div class="header-left">
      <a class="brand" th:href="@{/}">portfinder</a>
      <nav class="nav">
        <a th:href="@{/}">feed</a>
        <a th:href="@{/categories}">categories</a>
        <a th:href="@{/submit}">submit</a>
        <a th:if="${currentUser != null and currentUser.admin}" th:href="@{/moderation}">moderation</a>
      </nav>
    </div>
    <div class="header-right">
      <th:block th:if="${currentUser != null}">
        <span class="user-chip" th:text="${currentUser.displayName}">user</span>
        <form th:action="@{/logout}" method="post" class="inline-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn ghost small">sign out</button>
        </form>
      </th:block>
      <a th:if="${currentUser == null and oauthEnabled}" class="btn small" th:href="@{/oauth2/authorization/google}">sign in with Google</a>
      <span th:if="${currentUser == null and !oauthEnabled}" class="muted-note">auth offline</span>
    </div>
  </header>
  <main class="shell" th:replace="${content}">
  </main>
  <footer class="site-footer">
    <p>Metadata and links only. Never hosts ROMs or copyrighted game assets.</p>
    <p class="footer-links">
      <a th:href="@{/privacy}">Privacy</a>
      <span aria-hidden="true">·</span>
      <a th:href="@{/terms}">Terms</a>
    </p>
  </footer>
  <dialog id="signin-dialog" class="modal">
    <h2>Sign in to vote</h2>
    <p>Join the community discovering decomp and recomp ports.</p>
    <div class="actions">
      <a th:if="${oauthEnabled}" class="btn" th:href="@{/oauth2/authorization/google}">sign in with Google</a>
      <button type="button" class="btn ghost" data-close-dialog>cancel</button>
    </div>
  </dialog>
  <script th:src="@{/js/matrix-rain.js}" defer></script>
  <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
