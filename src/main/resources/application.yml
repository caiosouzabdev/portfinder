spring:
  application:
    name: portfinder
  thymeleaf:
    cache: false
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:portfinder;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope:
              - openid
              - profile
              - email

server:
  port: ${PORT:8080}

portfinder:
  catalog:
    location-pattern: classpath:catalog/projects/*.json
  base-url: ${PORTFINDER_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
  moderation:
    admin-emails: ${PORTFINDER_ADMIN_EMAILS:portsfinder@gmail.com}
  security:
    oauth-enabled: ${PORTFINDER_OAUTH_ENABLED:false}
  rate-limit:
    votes-per-minute: 30
    submits-per-hour: 5
